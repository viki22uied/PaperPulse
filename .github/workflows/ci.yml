name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # backtest (optopsy) is gated to Python >=3.12 by its own env marker,
          # so this is a no-op on the 3.10/3.11 jobs and exercises the real
          # optopsy integration (not just the skip path) on 3.12.
          pip install -e ".[dev,backtest]"
      - name: Test
        run: pytest -q
      - name: Type check
        run: mypy paperpulse
