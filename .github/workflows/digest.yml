name: Daily digest

# Scheduled arXiv digest. Runs every weekday morning, commits the new digest,
# and (optionally) emails it. Enable by adding repository secrets for whichever
# delivery channel you want.
on:
  schedule:
    - cron: "0 7 * * 1-5"  # 07:00 UTC, Mon-Fri
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[semantic]"
      - name: Generate digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAPERPULSE_SMTP_HOST: ${{ secrets.PAPERPULSE_SMTP_HOST }}
          PAPERPULSE_SMTP_USER: ${{ secrets.PAPERPULSE_SMTP_USER }}
          PAPERPULSE_SMTP_PASSWORD: ${{ secrets.PAPERPULSE_SMTP_PASSWORD }}
        # arXiv throttles or blocks GitHub's shared runner IPs now and then
        # (429, 406). The source already retries and falls back to the listing
        # feed; if all of that fails, wait out the throttle and retry the run.
        run: |
          for attempt in 1 2 3; do
            paperpulse run && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::paperpulse run failed (attempt $attempt/3); retrying in 10 minutes"
              sleep 600
            fi
          done
          exit 1
      - name: Commit digest
        run: |
          git config user.name "paperpulse-bot"
          git config user.email "paperpulse-bot@users.noreply.github.com"
          git add digests/ .paperpulse_state.json || true
          git commit -m "Add digest for $(date -u +%Y-%m-%d)" || echo "no changes"
          git push || true
