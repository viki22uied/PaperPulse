[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpulse"
dynamic = ["version"]  # single source of truth: paperpulse/__init__.py
description = "Relevance-ranked, trust-scored arXiv digests for quant finance and research: alpha cards, a LaTeX-rendered dashboard, and an options-backtest demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "viki22uied" }]
keywords = [
    "arxiv", "research", "digest", "nlp", "embeddings", "recommender",
    "quant-finance", "finance", "econometrics", "backtesting", "options-trading",
    "trust-score", "paper-triage",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.23,<3",
    "scikit-learn>=1.1,<2",
    "pyyaml>=6.0,<7",
    "rich>=13,<16",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2,<6"]
llm = ["openai>=1.0,<2", "anthropic>=0.30,<1"]
pdf = ["pypdf>=4.0,<6"]
# Not bundled into `all`: optopsy is AGPL-3.0 (everything else here is
# permissively licensed) and needs Python 3.12+, one major version ahead of
# PaperPulse's own floor -- so it stays an explicit, separate opt-in.
backtest = ["optopsy>=2.3,<3; python_version >= '3.12'"]
dev = ["pytest>=7.0,<10", "mypy>=1.8,<2", "types-PyYAML"]
all = [
    "sentence-transformers>=2.2,<6",
    "openai>=1.0,<2",
    "anthropic>=0.30,<1",
    "pypdf>=4.0,<6",
]

[project.scripts]
paperpulse = "paperpulse.cli:main"

[project.urls]
Homepage = "https://github.com/viki22uied/PaperPulse"
Repository = "https://github.com/viki22uied/PaperPulse"
Issues = "https://github.com/viki22uied/PaperPulse/issues"

[tool.setuptools.dynamic]
version = { attr = "paperpulse.__version__" }

[tool.setuptools.packages.find]
include = ["paperpulse*"]
exclude = ["tests*"]

[tool.mypy]
# No python_version pin: each CI matrix job checks against its own interpreter,
# so 3.10/3.11/3.12 all get covered. Pinning it here made mypy parse the newer
# numpy stubs (which use 3.12 `type` statements) as 3.10 syntax and hard-fail.
ignore_missing_imports = false

# Optional extras: guarded by try/except ImportError at their call sites and not
# installed in the base env, so mypy can't see them. Everything else must type.
[[tool.mypy.overrides]]
module = [
    "openai.*",
    "anthropic.*",
    "pypdf.*",
    "sklearn.*",
    "sentence_transformers.*",
    "optopsy.*",
]
ignore_missing_imports = true
